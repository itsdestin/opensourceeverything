<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home page demo</title>
<!-- WHY Outfit: the YouCoded theme's font (youcoded.json); Cascadia Mono stays for the AI prompt box. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-mono@5.2.3/400.css">
<link rel="stylesheet" href="demo.css">
<style>
/* Home-only pieces; everything else comes from demo.css. */
.page { padding-top:12px; }
.hero2 { padding:16px; display:flex; flex-direction:column; gap:12px; }
.hero-row { display:flex; align-items:center; gap:12px; }
.hero2 .searchwrap { width:min(520px,45%); }
.hero2 .searchpill { padding:6px 6px 6px 14px; }
.hero2 .searchpill input { font-size:14px; }
.pop { display:flex; align-items:center; gap:8px; min-width:0; padding-left:40px; }
.headline { flex:1; min-width:0; }
.headline h1 { font-size:16px; font-weight:600; margin:0; }
.hometop .searchwrap { width:min(520px,45%); }
.row1 { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.gcard .gap-line { min-height:2.9em; }
.hero { padding:24px; display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center; }
.hero h1 { font-size:18px; font-weight:600; margin:0; }
.hero .searchwrap { width:min(640px,100%); }
.hero .searchpill { padding:8px 8px 8px 16px; }
.hero .searchpill input { font-size:14px; }
.hero .fchips { justify-content:center; flex-wrap:nowrap; max-width:100%; }
.fchips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
.fchips::-webkit-scrollbar { display:none; }
.fchip { flex:none; padding:4px 12px; border-radius:var(--radius-control); font-size:12px; background:var(--inset); color:var(--fg-2); border:1px solid var(--edge); white-space:nowrap; }
.fchip:hover { color:var(--fg); }
.rail .card { flex:0 0 300px; }
.rail { padding:8px 4px 16px; margin:-8px -4px -16px; }
.gcard .gap-line { font-size:12px; color:var(--fg-2); margin:0; }
.gcard .gap-line b { font-weight:500; color:var(--fg); }
.groups { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:8px; }
.grow-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; cursor:pointer; text-align:left; width:100%; }
.grow-row:hover { background:var(--inset); }
.grow-row .nm { font-size:14px; color:var(--fg); }
.grow-row .rp { font-size:11px; color:var(--fg-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.builders { padding:16px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.builders .btns { display:flex; gap:8px; flex-wrap:wrap; }
.footer { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.footchip { padding:4px 12px; border-radius:var(--radius-control); font-size:12px; color:var(--fg-2); border:1px solid var(--edge);
  background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.footchip:hover { color:var(--fg); border-color:var(--edge-strong); }
@media (max-width:640px) {
  .hero-row { flex-wrap:wrap; }
  .hero-row .headline { flex-basis:calc(100% - 44px); }
  .hero2 .searchwrap { width:100%; }
  .pop { padding-left:0; }
  .row1 { display:flex; overflow-x:auto; scrollbar-width:none; padding:8px 4px 16px; margin:-8px -4px -16px; }
  .row1 .card { flex:0 0 260px; }
  .hero { padding:16px; }
  .hero .fchips { justify-content:flex-start; }
  .rail .card { flex-basis:260px; }
  .builders .btns { width:100%; flex-direction:column-reverse; } .builders .btns .btn { width:100%; }
}
</style>
</head>
<body>
<div class="demo-note">Clickable demo. Real project names; every number, person and comment is made up, and nothing is saved. Only Documents opens.</div>

<div class="page" id="page"></div>

<div class="scrim" id="scrim"><div class="dialog surface" id="dialog"></div></div>
<div class="toast" id="toast"></div>

<script>
const ICON = {
  thumb: d => `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${d?'style="transform:scaleY(-1)"':''}><path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M7 10l4-7a2 2 0 0 1 2 2v4h5.5a2 2 0 0 1 2 2.3l-1.2 7a2 2 0 0 1-2 1.7H7"/></svg>`,
  star: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2Z"/></svg>`,
  shield: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>`,
  user: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`,
  owner: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`,
  chev: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>`,
  check: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg>`,
  close: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  search: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ═══ Demo data (all made up) ═══ */
const GROUPS = [
  {id:'documents', name:'Documents', closed:['Google Docs','Microsoft Word','Apple Pages'], alts:7, notYet:38, votes:1084, wanted:'Suggestion mode as smooth as Google Docs\''},
  {id:'design', name:'Design', closed:['Figma','Canva','Adobe XD'], alts:6, notYet:78, votes:912, wanted:'Live multiplayer editing like Figma'},
  {id:'maps', name:'Maps', closed:['Google Maps','Apple Maps'], alts:4, notYet:71, votes:640, wanted:'Live traffic'},
  {id:'photo', name:'Photo editing', closed:['Photoshop','Lightroom'], alts:8, notYet:64, votes:1203, wanted:'Adjustment layers that open Photoshop files'},
  {id:'video', name:'Video editing', closed:['Premiere Pro','Final Cut','CapCut'], alts:7, notYet:58, votes:587, wanted:'Fast export on any graphics card'},
  {id:'notes', name:'Notes & wikis', closed:['Notion','Evernote','Obsidian'], alts:31, notYet:52, votes:2410, wanted:'Linked databases like Notion\'s'},
  {id:'sheets', name:'Spreadsheets', closed:['Excel','Google Sheets'], alts:9, notYet:41, votes:733, wanted:'Excel macros that just run'},
  {id:'email', name:'Email', closed:['Gmail','Outlook'], alts:8, notYet:35, votes:498, wanted:'A phone app as polished as Gmail'},
  {id:'chat', name:'Team chat', closed:['Slack','Discord','Teams'], alts:12, notYet:33, votes:1544, wanted:'Voice rooms like Discord'},
  {id:'calls', name:'Video calls', closed:['Zoom','Google Meet'], alts:6, notYet:29, votes:802, wanted:'Calls with 100+ people that stay smooth'},
  {id:'storage', name:'Cloud storage', closed:['Dropbox','Google Drive','OneDrive'], alts:10, notYet:22, votes:961, wanted:'Phone photo backup that never misses one'},
  {id:'passwords', name:'Password managers', closed:['1Password','LastPass'], alts:5, notYet:8, votes:1320, wanted:'Sharing with family without a server'},
];
const BEST = [
  {name:'Bitwarden', group:'Password managers', pct:96, votes:412, license:'GPL-3.0', gh:'17k', verified:true, blurb:'Passwords on every device, with a free plan and the option to host it yourself.'},
  {name:'OnlyOffice Docs', group:'Documents', gid:'documents', id:'onlyoffice', pct:91, votes:47, license:'AGPL-3.0', gh:'6.2k', verified:true, blurb:'Office suite focused on matching Microsoft\'s file formats. Runs in the browser or as a desktop app.'},
  {name:'Jitsi Meet', group:'Video calls', pct:88, votes:233, license:'Apache-2.0', gh:'24k', verified:true, blurb:'Video calls in the browser with no account needed. Host it yourself or use theirs.'},
  {name:'LibreOffice Writer', group:'Documents', gid:'documents', id:'libreoffice', pct:87, votes:45, license:'MPL-2.0', gh:null, verified:true, blurb:'The long-running free office suite\'s word processor. Desktop only; no live co-editing.'},
  {name:'Thunderbird', group:'Email', pct:84, votes:190, license:'MPL-2.0', gh:null, verified:true, blurb:'Desktop email, calendar and contacts from Mozilla.'},
  {name:'Penpot', group:'Design', pct:74, votes:121, license:'MPL-2.0', gh:'34k', verified:true, blurb:'Design and prototyping in the browser, built on open web standards.'},
  {name:'Organic Maps', group:'Maps', pct:81, votes:98, license:'Apache-2.0', gh:'11k', verified:true, blurb:'Offline maps for hiking and travel, with no tracking.'},
  {name:'Kdenlive', group:'Video editing', pct:79, votes:144, license:'GPL-3.0', gh:null, verified:true, blurb:'Multi-track video editor from the KDE project.'},
];
const NEW = [
  {name:'NoteNest', group:'Notes & wikis', age:'3 weeks old', built:'Vibe-coded', help:'Testers on Windows', blurb:'Owner says: Notion-style tables that run fully offline in one file. Early.'},
  {name:'Framewise', group:'Video editing', age:'2 months old', built:'AI-assisted', help:'Faster export on AMD cards', blurb:'Owner says: a simple editor for short clips, built on Kdenlive\'s engine.'},
  {name:'Tallyo', group:'Spreadsheets', age:'5 weeks old', built:'Hand-built', help:'Someone who knows Excel formulas', blurb:'Owner says: a spreadsheet that opens Excel files in the browser, nothing uploaded.'},
  {name:'Sketchroom', group:'Design', age:'6 weeks old', built:'Agentic engineering', help:'Design feedback', blurb:'Owner says: Figma-style live editing, self-hosted. Text tools still rough.'},
];
NEW.push({name:'Inkwell', group:'Email', age:'4 weeks old', built:'Hand-built', help:'Testers with Outlook accounts', blurb:'Owner says: a calm desktop email app that reads Outlook and Gmail.'},
  {name:'Huddle', group:'Video calls', age:'7 weeks old', built:'AI-assisted', help:'Someone who knows WebRTC', blurb:'Owner says: drop-in voice rooms like Discord, for small teams.'});
const POPULAR = ['Google Docs','Notion','Photoshop','Slack','Figma','Microsoft Word','Zoom'];
const S = { user:null, groupSort:'gap' };
try { S.user = sessionStorage.getItem('demoUser'); } catch (e) {}

/* ═══ Rendering ═══ */
function gapCard(g) {
  return `<button class="card gcard" data-act="openGroup" data-id="${g.id}">
    <div class="head"><h3>${esc(g.name)}</h3><div class="corner" style="margin-right:0"><span class="pill warn"><i></i>${g.notYet}% say not yet</span></div></div>
    <div class="chiprow"><span class="chip"><b>${g.alts}</b>open alternatives</span><span class="chip"><b>${g.votes.toLocaleString()}</b>votes</span></div>
    <p class="gap-line">Most wanted: <b>${esc(g.wanted)}</b></p>
    <div class="foot">Replaces ${esc(g.closed.join(', '))}</div></button>`;
}
function altCard(a) {
  return `<button class="card" data-act="openAlt" data-gid="${a.gid||''}" data-id="${a.id||''}" data-group="${esc(a.group)}">
    <div class="head"><h3>${esc(a.name)}</h3></div>
    <div class="chiprow">
      ${a.verified?`<span class="chip">${ICON.shield}Verified</span>`:''}
      <span class="chip" title="${a.pct}% of ${a.votes} say it works as a replacement">${ICON.thumb(false)}${a.pct}%</span>
      <span class="chip">${esc(a.group)}</span>
      <span class="chip">${a.license}</span>
      ${a.gh?`<span class="chip">${ICON.star}${a.gh} on GitHub</span>`:`<span class="chip">Not on GitHub</span>`}
    </div>
    <p class="blurb">${esc(a.blurb)}</p></button>`;
}
function newCard(a) {
  return `<button class="card" data-act="openOther" data-group="${esc(a.group)}">
    <div class="head"><h3>${esc(a.name)}</h3><div class="corner" style="margin-right:0"><span class="pill info">New</span></div></div>
    <div class="chiprow"><span class="chip">${ICON.owner}Owner</span><span class="chip">${esc(a.group)}</span><span class="chip">${a.built}</span><span class="chip">${a.age}</span></div>
    <p class="blurb">${esc(a.blurb)}</p>
    <div class="foot">Help wanted: ${esc(a.help)}</div></button>`;
}
const GSORTS = {gap:'Biggest gap first', az:'A to Z', most:'Most alternatives'};
function groupList() {
  const list = GROUPS.slice().sort({gap:(a,b)=>b.notYet-a.notYet, az:(a,b)=>a.name.localeCompare(b.name), most:(a,b)=>b.alts-a.alts}[S.groupSort]);
  return list.map(g => `<button class="lvl1 grow-row" data-act="openGroup" data-id="${g.id}">
    <div style="min-width:0"><div class="nm">${esc(g.name)}</div><div class="rp">${esc(g.closed.join(', '))}</div></div>
    <span class="chip"><b>${g.alts}</b>alternatives</span></button>`).join('');
}
function render() {
  const gaps = GROUPS.filter(g => g.votes >= 100).sort((a,b) => b.notYet - a.notYet).slice(0, 6);
  document.getElementById('page').innerHTML = `
  <!-- Hero card: account, headline, search and popular picks in one card (no bare text on the wallpaper). -->
  <div class="surface hero2">
    <div class="hero-row">
      <div class="dd"><button class="avatar" id="acct" data-act="acct" aria-label="Account"></button><div class="menu left" id="acctMenu"></div></div>
      <div class="headline">
        <h1>Open-source replacements for the apps you use</h1>
        <p class="desc12">Rated by the r/TrueOpenSource community, with what's still missing.</p>
      </div>
      <div class="searchwrap">
        <div class="searchpill">${ICON.search}<input id="q" type="text" placeholder="Search a closed app, like Google Docs…" autocomplete="off" aria-label="Search"></div>
        <div class="menu search-menu" id="searchMenu"></div>
      </div>
    </div>
    <div class="pop"><span class="muted11">Popular</span><div class="fchips">${POPULAR.map(p=>`<button class="fchip" data-act="pick" data-v="${p}">${p}</button>`).join('')}</div></div>
  </div>
  <section class="surface sec">
    <div class="sec-head"><div><h2 class="h-large">Biggest gaps</h2><p class="desc12">Where most people say nothing good replaces it yet. A good place to start building.</p></div><button class="btn sm secondary" data-act="toast" data-msg="Opens the full list. Not part of this demo.">See all</button></div>
    <div class="row1" data-row="gaps">${gaps.map(gapCard).join('')}</div>
  </section>

  <section class="surface sec">
    <div class="sec-head"><div><h2 class="h-large">Best rated</h2><p class="desc12">Alternatives people here say really work as a replacement</p></div><button class="btn sm secondary" data-act="toast" data-msg="Opens the full list. Not part of this demo.">See all</button></div>
    <div class="row1" data-row="best">${BEST.map(altCard).join('')}</div>
  </section>

  <section class="surface sec">
    <div class="sec-head"><div><h2 class="h-large">New and looking for help</h2><p class="desc12">Recently added by the people who build them</p></div><button class="btn sm secondary" data-act="toast" data-msg="Opens the full list. Not part of this demo.">See all</button></div>
    <div class="row1" data-row="new">${NEW.map(newCard).join('')}</div>
  </section>

  <div class="surface builders">
    <div style="min-width:0;max-width:640px">
      <h2 class="h-large">Building an open alternative?</h2>
      <p class="small2" style="margin-top:4px">See what already exists, reuse parts of it, or add your project so people can find and rate it. The whole map is free to download, for people and AI assistants.</p>
    </div>
    <div class="btns">
      <button class="btn md secondary" data-act="download">Download the whole map</button>
      <button class="btn md primary" data-act="addProject">Add your project</button>
    </div>
  </div>

  <section class="surface sec">
    <div class="sec-head">
      <div><h2 class="h-large">All groups<span class="count">${GROUPS.length}</span></h2><p class="desc12">Every kind of app on the map</p></div>
      <div class="dd"><button class="select sm" data-act="menu" data-menu="gsortMenu">${GSORTS[S.groupSort]}${ICON.chev}</button>
        <div class="menu" id="gsortMenu">${Object.entries(GSORTS).map(([k,v])=>`<button class="mi ${k===S.groupSort?'sel':''}" data-act="setGSort" data-v="${k}">${v}${k===S.groupSort?ICON.check:''}</button>`).join('')}</div></div>
    </div>
    <div class="groups">${groupList()}</div>
  </section>

  <!-- WHY separate chips (Destin, Oct 27): each footer link is its own glass chip, not words in one bar. -->
  <div class="footer">
    <button class="footchip" data-act="about">How this works</button>
    <button class="footchip" data-act="about">What counts as open source</button>
    <button class="footchip" data-act="credits">Data license: CC BY-SA 4.0</button>
    <button class="footchip" data-act="credits">Credits</button>
    <button class="footchip" data-act="toast" data-msg="Opens r/TrueOpenSource on Reddit.">r/TrueOpenSource</button>
  </div>`;
  fitRows();
  wireSearch();
  renderAcct();
}

/* ═══ Search ═══ */
function showPopular() {
  const sm = document.getElementById('searchMenu');
  sm.innerHTML = '<div class="menu-note">Popular</div>' + POPULAR.map(p => `<button class="mi" data-act="pick" data-v="${p}">${p}<span class="muted11">${esc(ALL_CLOSED.find(x=>x.c===p).g.name)}</span></button>`).join('');
  sm.classList.add('open');
}
// WHY: show as many cards as fit on one line, so a row never ends in empty space; phones scroll instead.
function fitRows() {
  document.querySelectorAll('.row1').forEach(r => {
    const cards = [...r.children], wide = innerWidth > 640;
    const n = wide ? Math.max(1, Math.floor((r.clientWidth + 12) / (280 + 12))) : cards.length;
    r.style.gridTemplateColumns = wide ? `repeat(${Math.min(n, cards.length)}, minmax(0,1fr))` : '';
    cards.forEach((c, i) => c.style.display = i < n ? '' : 'none');
  });
}
addEventListener('resize', fitRows);
const ALL_CLOSED = GROUPS.flatMap(g => g.closed.map(c => ({c, g})));
function wireSearch() {
  const q = document.getElementById('q'), sm = document.getElementById('searchMenu');
  q.addEventListener('input', () => {
    const t = q.value.trim().toLowerCase();
    if (!t) { sm.classList.remove('open'); return; }
    const closed = ALL_CLOSED.filter(x => x.c.toLowerCase().includes(t)).slice(0, 6)
      .map(x => `<button class="mi" data-act="pick" data-v="${esc(x.c)}">${esc(x.c)}<span class="muted11">${esc(x.g.name)}</span></button>`);
    const groups = GROUPS.filter(g => g.name.toLowerCase().includes(t))
      .map(g => `<button class="mi" data-act="openGroup" data-id="${g.id}">${esc(g.name)}<span class="muted11">Group</span></button>`);
    const alts = [...BEST, ...NEW].filter(a => a.name.toLowerCase().includes(t))
      .map(a => `<button class="mi" data-act="${a.gid?'openAlt':'openOther'}" data-gid="${a.gid||''}" data-id="${a.id||''}" data-group="${esc(a.group)}">${esc(a.name)}<span class="muted11">Open alternative · ${esc(a.group)}</span></button>`);
    sm.innerHTML = (closed.length?'<div class="menu-note">Closed apps</div>'+closed.join(''):'') + (groups.length?'<div class="menu-note">Groups</div>'+groups.join(''):'') + (alts.length?'<div class="menu-note">Open projects</div>'+alts.join(''):'')
      || `<div class="menu-note">Nothing matches "${esc(q.value)}" yet. Ask for it on r/TrueOpenSource.</div>`;
    sm.classList.add('open');
  });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { const f = sm.querySelector('.mi:not(:disabled)'); if (f) f.click(); } });
}

/* ═══ Account (same simulated GitHub sign-in as the group page) ═══ */
function renderAcct() {
  const b = document.getElementById('acct'), m = document.getElementById('acctMenu');
  if (!S.user) { b.innerHTML = ICON.user; b.title = 'Sign in';
    m.innerHTML = `<div class="menu-note">Sign in to vote and comment.</div><button class="mi" data-act="signin">Sign in with GitHub</button>`; }
  else { b.textContent = S.user[0].toUpperCase(); b.title = 'Signed in as ' + S.user;
    m.innerHTML = `<div class="menu-note">Signed in as <b class="num">@${esc(S.user)}</b></div><a class="mi" href="mod.html">Mod page<span class="muted11">mods only</span></a><div class="menu-sep"></div><button class="mi" data-act="signout">Sign out</button>`; }
  try { S.user ? sessionStorage.setItem('demoUser', S.user) : sessionStorage.removeItem('demoUser'); } catch (e) {}
}
const scrim = document.getElementById('scrim'), dialog = document.getElementById('dialog');
function openDialog(html, size='') { dialog.className = 'dialog surface ' + size; dialog.innerHTML = html; scrim.classList.add('open'); }
function closeDialog() { scrim.classList.remove('open'); }
const bar = t => `<div class="bar"><span class="t">${t}</span><button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button></div>`;
function signIn() {
  openDialog(`${bar('Sign in to take part')}<div class="body">
    <p class="body2">Reading is open to everyone. To vote or comment, sign in with your GitHub account.</p>
    <p class="small2">We only see your public GitHub name and picture. Nothing else, and nothing in your code.</p>
    <div class="foot-btns"><button class="btn md secondary" data-act="close">Not now</button><button class="btn md primary" data-act="ghpage">Sign in with GitHub</button></div></div>`, 'narrow');
}

/* ═══ Actions ═══ */
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }
function closeMenus() { document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); }
const goGroup = (id, extra='') => { if (id === 'documents') location.href = 'group-page.html' + extra; else toast('Only the Documents group opens in this demo.'); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('.menu') && !e.target.closest('.searchwrap')) closeMenus(); if (e.target === scrim) closeDialog(); return; }
  const act = el.dataset.act;
  if (act !== 'menu' && act !== 'acct') closeMenus();
  if (el.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'menu': { const m = document.getElementById(el.dataset.menu); const was = m.classList.contains('open'); closeMenus(); m.classList.toggle('open', !was); break; }
    case 'acct': { const m = document.getElementById('acctMenu'); const was = m.classList.contains('open'); closeMenus(); m.classList.toggle('open', !was); break; }
    case 'setGSort': S.groupSort = el.dataset.v; render(); break;
    case 'pick': { const hit = ALL_CLOSED.find(x => x.c === el.dataset.v); if (hit) goGroup(hit.g.id, '?compare=' + encodeURIComponent(hit.c)); break; }
    case 'openGroup': goGroup(el.dataset.id); break;
    case 'openAlt': if (el.dataset.gid) goGroup(el.dataset.gid, '#' + el.dataset.id); else toast(`${el.dataset.group} doesn't open in this demo. Only Documents does.`); break;
    case 'openOther': toast(`${el.dataset.group} doesn't open in this demo. Only Documents does.`); break;
    case 'toast': toast(el.dataset.msg); break;
    case 'addProject': goGroup('documents', '#add'); break;
    case 'download': {
      const data = JSON.stringify({license:'CC BY-SA 4.0', groups:GROUPS.map(g=>({name:g.name, replaces:g.closed, open_alternatives:g.alts, say_not_yet_percent:g.notYet, most_wanted:g.wanted}))}, null, 2);
      const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
      const a = document.createElement('a'); a.href = url; a.download = 'alternatives-map.json'; a.click(); URL.revokeObjectURL(url);
      toast('Downloaded alternatives-map.json'); break;
    }
    case 'about':
      openDialog(`${bar('How this works')}<div class="body">
        <div><span class="label">What counts as open source</span><div class="lvl1 pitch"><p class="small2">Only projects under a license the Open Source Initiative approves. "Source-available" licenses don't count. Projects that keep key features paid get an "Open core" tag.</p></div></div>
        <div><span class="label">Ratings</span><div class="lvl1 pitch"><p class="small2">People signed in with GitHub answer "does it work as a replacement for you?" Accounts under 14 days old can't vote yet. GitHub stars are shown for reference.</p></div></div>
        <div><span class="label">Verified and Owner</span><div class="lvl1 pitch"><p class="small2"><b class="num">Verified</b>: r/TrueOpenSource mods checked it. <b class="num">Owner</b>: the people who build it wrote its description.</p></div></div>
        <div><span class="label">How it was built</span><div class="lvl1 pitch"><p class="small2">Owners pick one: Hand-built, AI-assisted, Agentic engineering or Vibe-coded. Imported projects say "Not labeled" until their owner picks. We never guess.</p></div></div>
        <div class="foot-btns"><button class="btn md primary" data-act="close">Done</button></div></div>`, 'medium'); break;
    case 'credits':
      openDialog(`${bar('Credits')}<div class="body"><p class="small2">The first list was built from awesome-privacy (CC0), awesome-foss-alternatives (CC BY 4.0), switching.software (CC BY-SA 4.0), awesome-oss-alternatives and open-source-alternatives (MIT), OpenAlternative (CC0) and awesome-selfhosted (CC BY-SA 3.0). Thank you to everyone who maintains them.</p>
        <div class="foot-btns"><button class="btn md primary" data-act="close">Done</button></div></div>`, 'narrow'); break;
    case 'close': closeDialog(); break;
    case 'signin': signIn(); break;
    case 'ghpage':
      openDialog(`${bar('github.com (simulated)')}<div class="body"><div class="gh">
        <div style="font-size:18px;font-weight:600">Authorize Alternatives Map</div>
        <div style="font-size:14px">Alternatives Map by <b>r-TrueOpenSource</b> wants to access your <b>sample-user</b> account.</div>
        <div style="font-size:13px;color:#59636e">Public profile information only (read-only).</div>
        <button class="ghbtn" data-act="authorize">Authorize</button></div></div>`, 'narrow'); break;
    case 'authorize': S.user = 'sample-user'; closeDialog(); renderAcct(); toast('Signed in as @sample-user'); break;
    case 'signout': S.user = null; renderAcct(); toast('Signed out'); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDialog(); closeMenus(); } });
render();
</script>
</body>
</html>
