};
let CLOSED = ['Google Docs','Microsoft Word','Apple Pages','Zoho Writer'];
const BUILT = ['Hand-built','AI-assisted','Agentic engineering','Vibe-coded'];
const BUILT_HINT = {

  'AI-assisted':'Written by people, with AI help.',
  'Agentic engineering':'AI wrote most of it, with real history, polish and human testing.',

const D = {

  compared:'Google Docs', sort:'rated', showAll:false,
  gapVote:null, gapYes:672, gapTotal:1084,
  alts:[
    {id:'onlyoffice', ghN:6200, name:'OnlyOffice Docs', status:['ok','Active'], verified:true, up:43, down:4, license:'AGPL-3.0', gh:'6.2k', built:'Not labeled', age:'9 years old', ageN:9, tag:'Self-host', active:5,

                {u:'cara-sample',t:'last week',text:'Moved our small office off Google Docs with this. Took an afternoon.',up:9,replies:[]}]},
    {id:'libreoffice', ghN:0, name:'LibreOffice Writer', status:['ok','Active'], verified:true, up:39, down:6, license:'MPL-2.0', gh:null, part:'Part of LibreOffice', built:'Not labeled', age:'14 years old', ageN:14, tag:'Offline', active:4,

    {id:'cryptpad', ghN:5400, name:'CryptPad', status:['ok','Active'], owner:true, up:20, down:3, license:'AGPL-3.0', gh:'5.4k', built:'Hand-built', age:'8 years old', ageN:8, tag:'Encrypted', active:3, help:'8 tasks marked "help wanted"',
      blurb:'Owner says: like Google Docs, but even the server can\'t read your documents. Weaker on big files and Word import.', code:'github.com/cryptpad/cryptpad', people:96, last:'yesterday',
      reusable:'Encrypted real-time sync, usable in other apps.',

    {id:'collabora', ghN:2100, name:'Collabora Online', status:['warn','Quiet 2 months'], up:0, down:0, license:'MPL-2.0', gh:'2.1k', built:'Not labeled', age:'9 years old', ageN:9, tag:'Self-host', active:1,
      blurb:'LibreOffice running in the browser, for teams that host their own server.', code:'github.com/CollaboraOnline/online', people:210, last:'2 months ago',
      reusable:null, help:null, comments:[]},
    {id:'etherpad', ghN:17000, name:'Etherpad', status:['ok','Active'], up:9, down:4, license:'Apache-2.0', gh:'17k', built:'Not labeled', age:'15 years old', ageN:15, tag:'Real-time', active:2,

    'Google Docs':[{id:'r1',title:'Google can read everything I write',u:'ivan-sample',up:33,voted:false,replies:[]},{id:'r2',title:'Offline mode needs Chrome and an extension',u:'jo-sample',up:18,voted:false,replies:[]}],
    'Microsoft Word':[{id:'r3',title:'Copilot prompts every time it opens',u:'frank-sample',up:17,voted:false,replies:[]},{id:'r4',title:'Subscription for something I used to own',u:'kim-sample',up:15,voted:false,replies:[]}],
    'Apple Pages':[{id:'r5',title:'Only works on Apple devices',u:'lee-sample',up:8,voted:false,replies:[]}],
    'Zoho Writer':[],
  },
  pending:null,
};
const altById = id => D.alts.find(a => a.id === id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial = u => u ? u[0].toUpperCase() : '?';
// WHY per-alternative thumbs instead of stars (Destin, Oct 27): GitHub stars stay as information;
// our own signal is "does it work as a replacement for you?", the Marketplace's Helpful / Not for me.
const myVote = {};
const MIN_VOTES_FOR_PCT = 5;

/* ═══ Real map data (map-data.js) ═══ */
// WHY: any of the 92 groups opens here (?g=<id>) with its real projects, descriptions and licenses.
// Votes and comments are pretend: Documents keeps its hand-written samples, other groups get steady made-up numbers.
const PROJ = new Map(MAP.projects.map(p => [p.id, p]));
const GID = new URLSearchParams(location.search).get('g') || 'documents';
const G = MAP.groups.find(g => g.id === GID) || MAP.groups.find(g => g.id === 'documents');
const CAT = MAP.categories.find(c => c.id === G.category);
const isDocs = G.id === 'documents';
// A small seeded random so the pretend numbers stay the same on every visit.
const seeded = s => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return () => { h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909); return ((h >>> 0) % 10000) / 10000; }; };
const KIND = {app:'App', self_hosted:'Runs on your own server', developer_tool:'For developers', library:'Code library'};
const fmtStars = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n);
{
  const sample = new Map(D.alts.map(a => [a.name.toLowerCase(), a]));
  CLOSED = G.closed.length ? G.closed : ['(not named yet)'];
  D.compared = CLOSED[0];
  D.alts = G.alternatives.map(x => {
    const p = PROJ.get(x.project); const s = isDocs ? sample.get(p.name.toLowerCase()) : null; const r = seeded(p.id);
    const up = s ? s.up : (r() < 0.2 ? 0 : 1 + Math.floor(r() * 40)); const down = s ? s.down : Math.floor(up * r() * 0.35);
    return { id: p.id, name: p.name, fit: x.fit, note: x.note, status: p.inactive ? ['warn','Quiet for a year'] : ['ok','Active'],
      verified: s?.verified ?? false, owner: s?.owner ?? false, up, down, ghN: p.stars || 0, gh: p.stars ? fmtStars(p.stars) : null,
      license: p.license || 'License to confirm', openCore: p.licenseClass === 'open_core', built: s?.built ?? 'Not labeled',
      age: s?.age ?? '', ageN: s?.ageN ?? 0, tag: KIND[p.kind] || '', active: p.inactive ? 0 : (s?.active ?? 2),
      blurb: p.summary, code: p.code || p.website, people: s?.people ?? 'Not counted yet', last: p.inactive ? 'Over a year ago' : (s?.last ?? 'Within the last year'),
      reusable: s?.reusable ?? null, help: s?.help ?? null, comments: s?.comments ?? [] };
  });
  if (!isDocs) { D.missing = []; D.reasons = {}; const r = seeded(G.id); D.gapTotal = 20 + Math.floor(r() * 600); D.gapYes = Math.floor(D.gapTotal * (G.alternatives.length ? 0.3 + r() * 0.6 : 0.05)); }
}

/* ═══ Rendering ═══ */
function chips(a) {
  const c = [];
  if (a.pendingMine) c.push(`<span class="pill info">Waiting for a mod · only you see this</span>`);
  if (a.verified) c.push(`<span class="chip">${ICON.shield}Verified</span>`);
  if (a.owner) c.push(`<span class="chip">${ICON.user}Owner</span>`);
  const t = a.up + a.down;
  if (t >= MIN_VOTES_FOR_PCT) c.push(`<span class="chip" title="${Math.round(a.up/t*100)}% of ${t} people say it works as a replacement">${ICON.thumb(false).replace(/14/g,'12')}${Math.round(a.up/t*100)}%</span>`);
  else if (t > 0) c.push(`<span class="chip" title="${a.up} of ${t} say it works as a replacement">${ICON.thumb(false).replace(/14/g,'12')}${a.up} of ${t}</span>`);
  c.push(`<span class="chip">${esc(a.license)}</span>`);
  if (a.gh) c.push(`<span class="chip">${ICON.star(false).replace('16','12').replace('16','12')}${a.gh} on GitHub</span>`);
  // WHY: projects hosted on Codeberg, GitLab or their own servers have no GitHub stars; say so instead of showing nothing.
  if (!a.gh) c.push(`<span class="chip">Not on GitHub</span>`);
  if (a.openCore) c.push(`<span class="chip" title="Open source, with some parts paid or under another license">Open core</span>`);
  if (a.fit === 'partial') c.push(`<span class="chip" title="${esc(a.note || 'Covers part of the job')}">Replaces partly</span>`);
  c.push(`<span class="chip">${esc(a.built)}</span>`);
  return c.join('');
}
function sortedAlts() {
  const list = D.alts.slice();
  const by = {
    rated:(x,y)=>score(y)-score(x),
    github:(x,y)=>y.ghN-x.ghN,
    active:(x,y)=>y.active-x.active,
    newest:(x,y)=>x.ageN-y.ageN,
    verified:(x,y)=>(!!y.verified-!!x.verified)||(score(y)-score(x)),
  }[D.sort];
  list.sort(by);
  list.sort((x,y)=>!!y.pendingMine-!!x.pendingMine);
  return list;
}
const SORTS = {rated:'Best rated', verified:'Verified first', active:'Most active', newest:'Newest', github:'Most GitHub stars'};
// WHY a cautious score, not the raw %: 2 of 2 "yes" must not outrank 90 of 100 (lower bound of the Wilson interval).
function score(a){ const n=a.up+a.down; if(!n) return 0; const z=1.96, p=a.up/n; return (p+z*z/(2*n)-z*Math.sqrt((p*(1-p)+z*z/(4*n))/n))/(1+z*z/n); }

function card(a) {
  const n = a.comments.reduce((s,c)=>s+1+c.replies.length,0);
  const foot = [(a.up+a.down||n) ? `${n} ${n===1?'comment':'comments'}` : 'No votes or comments yet', a.age, a.tag].filter(Boolean).join(' · ');
  return `<div class="card" data-act="openAlt" data-id="${a.id}" role="button" tabindex="0">
    <div class="head"><h3>${esc(a.name)}</h3>
      <div class="corner" style="margin-right:0"><span class="pill ${a.status[0]}"><i></i>${a.status[1]}</span></div></div>
    <div class="chiprow">${chips(a)}</div>
    <p class="blurb">${esc(a.blurb)}</p>
    <div class="foot">${foot}</div></div>`;
}
function rankedRows(list, kind) {
  if (!list.length) return `<div class="empty">Nothing yet. Be the first to add one.</div>`;
  return list.slice().sort((x,y)=>y.up-x.up).map(r => `<div class="rrow" data-act="openItem" data-kind="${kind}" data-id="${r.id}">
    <button class="vote ${r.voted?'on':''}" data-act="voteItem" data-kind="${kind}" data-id="${r.id}" title="Upvote"><span>▲</span>${r.up}</button>
    <div style="min-width:0"><div class="rt">${esc(r.title)}</div><div class="muted11">${r.replies.length} ${r.replies.length===1?'reply':'replies'} · ${esc(r.u)}</div></div></div>`).join('');
}
function latest() {
  const items = [
    {where:'On OnlyOffice Docs · 2 hours ago', text:'Tables finally open right from .docx in the newest version.', act:'openAlt', id:'onlyoffice-docs'},
    {where:'Still missing · 5 hours ago', text:'Nothing open matches Google Docs\' suggestion mode yet.', act:'openItem', id:'m1', kind:'missing'},
    {where:'On CryptPad · yesterday', text:'Encrypted and in the browser. Slower with big files.', act:'openAlt', id:'cryptpad'},
    {where:'Why people leave Google Docs · 2 days ago', text:'Offline mode needs Chrome and an extension.', act:'openItem', id:'r2', kind:'reason', app:'Google Docs'},
    {where:'On LibreOffice Writer · 5 days ago', text:'Best fully offline option, but the look is dated.', act:'openAlt', id:'libreoffice-writer'},
  ];
  return items.map(i => `<button class="lvl1" data-act="${i.act}" data-id="${i.id}" ${i.kind?`data-kind="${i.kind}"`:''} ${i.app?`data-app="${i.app}"`:''}><span class="muted11">${i.where}</span><p>${esc(i.text)}</p></button>`).join('');
}
function render() {
  const pct = Math.round(D.gapYes / D.gapTotal * 100);
  const alts = sortedAlts();
  const shown = D.showAll ? alts : alts.slice(0, 5);
  const others = CLOSED.filter(c => c !== D.compared).join(', ');
  const verified = D.alts.filter(a=>a.verified).length;
  document.getElementById('page').innerHTML = `
  <div class="surface identity">
    <div class="row">
      <div><div class="muted11">${esc(CAT ? CAT.name : '')}</div><h1 class="h-subject">${esc(G.name)}</h1><p class="desc12" style="margin-top:4px">${esc(G.job)}.</p></div>
      <div class="field-col"><span class="label">Compared with</span>
        <div class="dd"><button class="select" data-act="menu" data-menu="cmpMenu">${esc(D.compared)}${ICON.chev}</button>
          <div class="menu" id="cmpMenu">${CLOSED.map(c=>`<button class="mi ${c===D.compared?'sel':''}" data-act="setCompared" data-v="${c}">${c}${c===D.compared?ICON.check:''}</button>`).join('')}</div></div></div>
    </div>
    <div class="chiprow">
      <span class="chip"><b>${D.alts.length}</b>open alternatives</span>
      <span class="chip"><b>${verified}</b>verified</span>
      <span class="chip"><b>${pct}%</b>say one works</span>
      ${others ? `<span class="chip">Also replaces ${esc(others)}</span>` : ''}
    </div>
  </div>

  ${isDocs ? `<section class="surface sec">
    <div class="sec-head"><h2 class="h-large">Latest across Documents</h2></div>
    <div class="rail">${latest()}</div>
  </section>` : ''}

  <div class="cols">
    <div>
      <section class="surface sec">
        <div class="sec-head">
          <div><h2 class="h-large">Open alternatives<span class="count">${D.alts.length}</span></h2><p class="desc12">Rated by people here: does it work as a replacement?</p></div>
          <div class="dd"><button class="select sm" data-act="menu" data-menu="sortMenu">${SORTS[D.sort]}${ICON.chev}</button>
            <div class="menu" id="sortMenu">${Object.entries(SORTS).map(([k,v])=>`<button class="mi ${k===D.sort?'sel':''}" data-act="setSort" data-v="${k}">${v}${k===D.sort?ICON.check:''}</button>`).join('')}</div></div>
        </div>
        <div class="grid">
          ${shown.map(card).join('')}
          <button class="card compose" data-act="addProject">${ICON.plus}
            <span style="font-size:14px;font-weight:500;color:var(--fg)">Add your project</span>
            <span>Built an open alternative to ${esc(D.compared)}? List it, in your own words, so people can find and rate it.</span></button>
        </div>
        ${alts.length ? '' : `<div class="callout info">Nothing open does this job yet. That makes it a gap: if you're building one, add it here.</div>`}
        ${alts.length > 5 ? `<div><button class="btn md secondary full" data-act="toggleAll">${D.showAll?'Show fewer':`Show all ${alts.length}`}</button></div>` : ''}
        <div><button class="btn md secondary full" data-act="suggestAlt">Suggest an open alternative that isn't yours</button></div>
      </section>

      <section class="surface sec">
        <div class="sec-head"><div><h2 class="h-large">Is there a good open replacement yet?</h2><p class="desc12">Vote, then add or upvote what's still missing</p></div></div>
          <div class="lvl1 feedback">
            <div><div class="small2"><b class="num">${pct}%</b> say yes <span class="muted11">· ${D.gapTotal.toLocaleString()} votes</span></div>
              <div class="meter"><i style="width:${pct}%"></i></div></div>
            <div class="btns">
              <button class="btn sm secondary ${D.gapVote==='yes'?'on':''}" data-act="gap" data-v="yes">Yes, one works</button>
              <button class="btn sm secondary ${D.gapVote==='no'?'on':''}" data-act="gap" data-v="no">Not yet</button>
            </div>
          </div>
          <div><span class="label">Still missing</span><div class="lvl2 ranked">${rankedRows(D.missing,'missing')}</div></div>
          <button class="btn md secondary full" data-act="addItem" data-kind="missing">+ Add what's missing</button>
      </section>

      <section class="surface sec">
        <div class="sec-head"><div><h2 class="h-large">Why people leave ${esc(D.compared)}</h2><p class="desc12">Problems with the closed app itself. Follows "Compared with" above.</p></div></div>
          <div class="lvl2 ranked">${rankedRows(D.reasons[D.compared] || [],'reason')}</div>
          <button class="btn md secondary full" data-act="addItem" data-kind="reason">+ Add a reason</button>
      </section>
    </div>

    <div>
      <section class="surface sec">
          <h2 class="h-large">Before you build</h2>
          <p class="small2">Building something for ${esc(G.name.toLowerCase())}? See what exists first, so you can reuse parts or explain what's different.</p>
          <div class="lvl2 prompt">${esc(promptText(false))}</div>
          <div class="stack">
            <button class="btn md primary" data-act="copy" data-full="0">Copy prompt</button>
            <button class="btn md secondary" data-act="copy" data-full="1">Copy with the list included</button>
            <button class="btn md secondary" data-act="download">Download the list</button>
          </div>
      </section>
      <section class="surface sec" style="gap:8px">
          <h2 class="h-large">About this page</h2>
          <p class="small2"><b class="num">Ratings</b> come from signed-in people here answering "does it work as a replacement?" Accounts under 14 days old can't vote yet.</p>
          <p class="small2"><b class="num">GitHub stars</b> are shown for reference. They measure popularity, not whether it replaces anything.</p>
          <p class="small2"><b class="num">Verified</b> means r/TrueOpenSource mods checked it: open-source license, maintained, and it really does the job.</p>
          <p class="small2"><b class="num">Owner</b> means the people who build it wrote its description.</p>
      </section>

/* ═══ Actions ═══ */
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }
function closeMenus(except) { document.querySelectorAll('.menu.open').forEach(m => { if (m !== except) m.classList.remove('open'); }); }
function canCount() { return !D.newAccount; }
function refresh() { render(); if (scrim.classList.contains('open') && reopen) reopen(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('.menu')) closeMenus(); if (e.target === scrim) closeDialog(); return; }
  const act = el.dataset.act, id = el.dataset.id;
  if (act !== 'menu' && act !== 'acct') closeMenus();
  switch (act) {
    case 'menu': { const m = document.getElementById(el.dataset.menu); const was = m.classList.contains('open'); closeMenus(); m.classList.toggle('open', !was); e.stopPropagation(); break; }
    case 'acct': { const m = document.getElementById('acctMenu'); const was = m.classList.contains('open'); closeMenus(); m.classList.toggle('open', !was); break; }
    case 'setCompared': D.compared = el.dataset.v; render(); toast(`Comparing with ${D.compared}`); break;
    case 'goClosed':
      if (el.dataset.g && el.dataset.g !== G.id) { location.href = `group-page.html?g=${el.dataset.g}&compare=${encodeURIComponent(el.dataset.v)}`; return; }
      D.compared = el.dataset.v; q.value = ''; sm.classList.remove('open'); render(); window.scrollTo({top:0,behavior:'smooth'}); toast(`Comparing with ${el.dataset.v}`); break;
    case 'goGroup': location.href = `group-page.html?g=${el.dataset.g}`; return;
    case 'goProject':
      if (altById(id)) { q.value = ''; sm.classList.remove('open'); openAlt(id); break; }
      if (el.dataset.g) location.href = `group-page.html?g=${el.dataset.g}#${id}`; return;
    case 'suggestAlt': suggestAlt(); break;
    case 'suggestClosed': q.value = ''; sm.classList.remove('open'); suggestClosed(el.dataset.v); break;
    case 'sendSuggestAlt': if (!document.getElementById('sgUrl').value.trim()) { toast('Paste its link first.'); return; } closeDialog(); toast('Sent to the mods. They check it and add it here.'); break;
    case 'sendSuggestClosed': if (!document.getElementById('scName').value.trim()) { toast('Name the app first.'); return; } closeDialog(); toast('Sent to the mods. Others can say they want it too.'); break;
    case 'reportListing': if (!needSignIn(() => reportListing(id))) return; reportListing(id); break;
    case 'sendReport': { const r = dialog.querySelector('input[name=rr]:checked'); closeDialog(); toast(`Reported (${r ? r.value.toLowerCase() : 'other'}). A mod will look at it.`); break; }
    case 'setSort': D.sort = el.dataset.v; render(); break;
    case 'toggleAll': D.showAll = !D.showAll; render(); break;
    case 'openAlt': e.stopPropagation(); q.value=''; sm.classList.remove('open'); openAlt(id); break;
    case 'openItem': if (el.dataset.app) D.compared = el.dataset.app, render(); openItem(el.dataset.kind, id); break;
    case 'close': closeDialog(); break;
    case 'toast': e.stopPropagation(); toast(el.dataset.msg); break;
    case 'rate': {
      if (!needSignIn(() => openAlt(id))) return;
      if (!canCount()) { toast('Your GitHub account is under 14 days old, so votes don\'t count yet.'); return; }
      const a = altById(id), v = el.dataset.v, prev = myVote[id];
      if (prev) a[prev]--;
      if (prev === v) delete myVote[id]; else { myVote[id] = v; a[v]++; }
      refresh();
      if (myVote[id] === 'down') { const b = document.getElementById('cbox'); b.placeholder = 'What\'s missing or broken? Your comment helps the people who build it.'; b.focus(); toast('Thanks. A comment saying why helps the builders most.'); }
      break;
    }
    case 'gap': {
      if (!needSignIn(() => document.querySelector(`[data-act=gap][data-v=${el.dataset.v}]`).click())) return;
      if (!canCount()) { toast('Your GitHub account is under 14 days old, so votes don\'t count yet.'); return; }
      const v = el.dataset.v;
      if (D.gapVote === null) D.gapTotal++; else if (D.gapVote === 'yes') D.gapYes--;
      if (D.gapVote === v) { D.gapVote = null; D.gapTotal--; } else { D.gapVote = v; if (v === 'yes') D.gapYes++; }
      render();
      if (D.gapVote === 'no') { toast('Thanks. What\'s missing? Upvote it below or add it.'); }
      break;
    }
    case 'voteItem': {
      e.stopPropagation();
      if (!needSignIn(() => {})) return;
      if (!canCount()) { toast('Your GitHub account is under 14 days old, so votes don\'t count yet.'); return; }
      const it = findItem(el.dataset.kind, id); it.voted = !it.voted; it.up += it.voted ? 1 : -1; refresh(); break;
    }
    case 'addItem': addItem(el.dataset.kind); break;
    case 'saveItem': {
      const v = document.getElementById('itemText').value.trim();
      if (!v) { toast('Write one short line first.'); return; }
      const it = {id:'x'+Date.now(), title:v, u:D.user, up:canCount()?1:0, voted:canCount(), replies:[]};
      (el.dataset.kind === 'missing' ? D.missing : (D.reasons[D.compared] ??= [])).push(it);
      closeDialog(); render(); toast(D.newAccount ? 'Added. A mod will check it first, because your account is new.' : 'Added, with your upvote.'); break;
    }
    case 'postCmt': case 'postReply': {
      const box = document.getElementById('cbox'); const v = box.value.trim();
      if (!needSignIn(reopen)) return;
      if (!v) { box.focus(); return; }
      const c = {u:D.user, t:'just now', text:v, up:0, replies:[], held:D.newAccount};
      if (act === 'postCmt') altById(id).comments.unshift(c); else findItem(el.dataset.kind, id).replies.push(c);
      refresh(); toast(D.newAccount ? 'Posted. A mod will check it first, because your account is new.' : 'Posted.'); break;
    }
    case 'upCmt': {
      if (!needSignIn(reopen)) return;
      const [aid, i] = el.dataset.path.split(':'); const c = altById(aid).comments[+i];
      c.voted = !c.voted; c.up += c.voted ? 1 : -1; refresh(); break;
    }
    case 'replyCmt': {
      const [aid, i] = el.dataset.path.split(':'); const box = document.getElementById('cbox');
      box.value = `@${altById(aid).comments[+i].u} `; box.focus(); break;
    }
    case 'copy': {
      const text = promptText(el.dataset.full === '1');
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
        () => toast(el.dataset.full === '1' ? 'Copied, with the list. Paste it into any AI assistant.' : 'Copied. Paste it into any AI assistant.'),
        () => toast('Copying needs the page to be open in a browser tab.'));
      break;
    }
    case 'download': {
      const data = JSON.stringify({group:G.name, replaces:CLOSED, license:'CC BY-SA 4.0', alternatives:D.alts.map(a=>({name:a.name, license:a.license, code:a.code, verified:!!a.verified, yes:a.up, no:a.down, github_stars:a.ghN, description:a.blurb, reusable:a.reusable}))}, null, 2);
      const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
      const link = document.createElement('a'); link.href = url; link.download = `${G.id}.json`; link.click(); URL.revokeObjectURL(url);
      toast(`Downloaded ${G.id}.json`); break;
    }
    case 'signin': needSignIn(null); break;
    case 'ghpage': ghPage(); break;
    case 'authorize': {
      D.user = 'sample-user'; closeDialog(); render(); toast('Signed in as @sample-user');
      const then = afterSignIn; afterSignIn = null; if (then) then(); break;
    }
    case 'signout': D.user = null; render(); toast('Signed out'); break;
    case 'toggleNew': D.newAccount = !D.newAccount; renderAcct(); toast(D.newAccount ? 'Demo: your account is now under 14 days old. Votes won\'t count; comments wait for a mod.' : 'Demo: your account is 2 years old again.'); break;
    case 'addProject': addProject(); break;
    case 'pCheck': saveProjectFields(); if (!P.url.trim()) { toast('Paste your project\'s link first.'); return; } P.checked = true; P.proved = false; renderProject(); break;
    case 'pProve': P.proved = true; renderProject(); break;
    case 'pNext': saveProjectFields(); if (P.step === 2 && !P.diff.trim()) { toast('Say what yours does differently first.'); return; } P.step++; renderProject(); break;
    case 'pBack': saveProjectFields(); P.step--; renderProject(); break;
    case 'pSubmit': {
      saveProjectFields();
      if (!P.built) { toast('Pick how it was built.'); return; }
      const name = (P.url.split('/').filter(Boolean).pop() || 'My project').replace(/[-_]/g,' ');
      D.alts.push({id:'mine', name:name.charAt(0).toUpperCase()+name.slice(1), status:['ok','Active'], owner:true, pendingMine:true, up:0, down:0, ghN:12, license:'MIT', gh:'12', built:P.built, age:'1 year old', ageN:1, tag:'New here', active:5,
        blurb:'Owner says: ' + (P.diff || P.s), code:P.url, people:3, last:'today', reusable:P.r||null, help:P.h||null, comments:[]});
      P.done = true; render(); renderProject(); break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (scrim.classList.contains('open')) closeDialog(); closeMenus(); sm.classList.remove('open'); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-act]')) { e.preventDefault(); openAlt(e.target.dataset.id); }
});
// WHY sessionStorage: the demo's sign-in carries between home.html and this page; never required.
try { const u = sessionStorage.getItem('demoUser'); if (u) D.user = u; } catch (e) {}
const _render = render;
render = function () { _render(); try { D.user ? sessionStorage.setItem('demoUser', D.user) : sessionStorage.removeItem('demoUser'); } catch (e) {} };
// home.html links here with ?compare=<closed app> and #<alternative id>
const params = new URLSearchParams(location.search);
if (CLOSED.includes(params.get('compare'))) D.compared = params.get('compare');
render();
if (location.hash && altById(location.hash.slice(1))) openAlt(location.hash.slice(1));
else if (location.hash === '#add') addProject();
else if (location.hash === '#suggest') suggestAlt();
</script>
