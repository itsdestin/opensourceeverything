# Builds and checks the site on every push and pull request. Publishing to GitHub Pages only happens when
# someone presses "Run workflow" on the Actions tab and ticks "publish".
# WHY manual publishing: the site goes public only when Destin decides it's ready to launch.
name: Site
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checker tests
        working-directory: checker
        run: npm ci && npm test
      - name: Build the site
        run: node site/build.mjs
      - name: Check the site
        run: node site/check.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          path: site/dist
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
