# Builds and checks the site on every push and pull request, and publishes to opensourceeverything.org whenever
# main changes (or when someone presses "Run workflow" and ticks "publish").
# WHY publish on main (launched Oct 27): a merged suggestion or weekly refresh goes live without anyone pressing a button.
name: Site
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checker tests
        working-directory: checker
        run: npm ci && npm test
      - name: Build the site
        # WHY: voting, notes and boards talk to the server at api.opensourceeverything.org (worker/).
        env:
          API_URL: https://api.opensourceeverything.org
        run: node site/build.mjs
      - name: Check the site
        run: node site/check.mjs
      - name: Search ranking tests
        # WHY: a change to the data or the ranker that makes search worse fails here instead of shipping.
        run: node site/test/search-eval.mjs && node site/test/search-eval.mjs --heldout
      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        with:
          path: site/dist
  publish:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
