name: Add a closed app
description: A closed app missing from a group, so people searching for it find the open alternatives
title: "Closed app: "
labels: [suggestion, add-closed-app]
body:
  - type: input
    id: app
    attributes: { label: Closed app, placeholder: "e.g. Microsoft Loop" }
    validations: { required: true }
  # WHY a pick list, optional (review Oct 26): people who search for "Procreate" don't know our group names, and a
  # typed name could drift from the real ones. The list is written from data/groups.json by prefill/sync-forms.mjs
  # (site/check.mjs fails if it falls behind), so it can't go out of date.
  - type: dropdown
    id: group
    attributes:
      label: Group
      description: "The job it does. Not sure? Keep the first choice and a mod will pick the right one."
      options:
        # BEGIN groups (written by prefill/sync-forms.mjs; do not edit by hand)
        - "None of these fit (a mod will choose)"
        - "3D & motion graphics"
        - "AI agents for everyday work"
        - "AI chat apps"
        - "AI coding assistants"
        - "AI image generation"
        - "AI search"
