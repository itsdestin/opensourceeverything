        - "Screen recording & streaming"
        - "Search engines"
        - "Security scanning"
        - "Sending big files"
        - "Server & app monitoring"
        - "Shared expenses"
        - "Site & app search"
        - "Smart home"
        - "Social media scheduling"
        - "Social network for friends & family"
