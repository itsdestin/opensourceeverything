name: Add a project
description: An open-source project that replaces a closed app
title: "Add: "
labels: [suggestion, add-project]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! A robot checks the license and age first, then a r/TrueOpenSource mod reviews it. Only projects under an [open-source license](https://opensource.org/licenses) can be listed.
  - type: input
    id: name
    attributes: { label: Project name }
    validations: { required: true }
  - type: input
    id: code
    attributes: { label: Link to its code, description: "Its GitHub, GitLab or Codeberg page", placeholder: "https://github.com/owner/project" }
    validations: { required: true }
  - type: input
    id: website
    attributes: { label: Its website, description: Optional }
  # WHY a pick list (review Oct 26): typed group names drifted from the real ones. Written from data/groups.json by
  # prefill/sync-forms.mjs; site/check.mjs fails if it falls behind.
  - type: dropdown
    id: group
    attributes:
      label: Group
      description: "The job it does. The button on a group page fills this in."
      options:
        # BEGIN groups (written by prefill/sync-forms.mjs; do not edit by hand)
        - "None of these fit (a mod will choose)"
        - "3D & motion graphics"
        - "AI agents for everyday work"
        - "AI chat apps"
        - "AI coding assistants"
        - "AI image generation"
        - "AI search"
        - "Antivirus"
        - "API tools"
        - "App backends"
        - "App hosting & deployment"
        - "App stores"
        - "Audio & music making"
        - "Automated builds & tests"
        - "Automation"
