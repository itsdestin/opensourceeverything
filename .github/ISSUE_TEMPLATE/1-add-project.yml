        - "Data warehouses"
        - "Database apps"
        - "Dating"
        - "Digital painting"
        - "Disappearing photos & stories"
        - "Document signing"
        - "Documents"
        - "E-books & audiobooks"
        - "Email"
        - "Email sending for apps"
        - "Events & meetups"
        - "Feature flags"
        - "Feedback & feature requests"
        - "Forms & surveys"
        - "Forums & link sharing"
        - "Game stores & launchers"
        - "Grammar & writing checker"
        - "Graph databases"
        - "Graphic design & templates"
        - "Home media server"
        - "Icon libraries"
        - "Illustration & vector"
        - "Infrastructure as code"
        - "Interface design"
        - "Internal tool builders"
        - "Internet speed test"
        - "Investment research"
        - "Invoicing & billing"
        - "Link shortening"
        - "Live streaming"
        - "Login & identity"
        - "Machine learning platforms"
        - "Maps & navigation"
        - "Messaging"
        - "Microblogging"
        - "Music streaming"
        - "News feeds & read-it-later"
