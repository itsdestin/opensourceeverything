# The Open Source Everything server: voting, notes and boards at api.opensourceeverything.org.
# Rules it enforces: docs/server-rules.md. Secrets (set with `wrangler secret put`, never in this file):
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET  — the "Sign in with GitHub" registration
#   GITHUB_READ_TOKEN (optional) — a token with no permissions, only to lift GitHub's 60-an-hour limit for reading public
#   suggestion issues. See docs/tokens-and-secrets.md.
name = "opensourceeverything-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "api.opensourceeverything.org", custom_domain = true }]

[vars]
SITE_ORIGIN = "https://opensourceeverything.org"
API_ORIGIN = "https://api.opensourceeverything.org"
# GitHub usernames of r/TrueOpenSource mods, comma-separated (Destin, Oct 27: just him for now).
MODS = "itsdestin"

# Cloudflare Workers AI, used only by GET /search (src/search.js) to turn typed words into a meaning vector.
# Free tier covers it; no key is needed because it is a binding, not an API call from outside.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "opensourceeverything"
database_id = "3855f173-9357-4b74-9ea0-4f6bc00aef01"
migrations_dir = "migrations"

# Local testing only (`npm run dev`): the site preview on :4322 talks to this server on :8787, and a test-only sign-in
# replaces GitHub. DEV_LOGIN is never set in the deployed server.
[env.dev]
name = "opensourceeverything-api-dev"
routes = []
[env.dev.vars]
SITE_ORIGIN = "http://localhost:4322"
API_ORIGIN = "http://localhost:8787"
MODS = "itsdestin,mod-sample"
DEV_LOGIN = "1"
# Stand-ins for GitHub and project websites so tests never touch the real ones (test/contrib.test.mjs starts them).
GITHUB_API = "http://127.0.0.1:8799/gh"
PROOF_RAW = "http://127.0.0.1:8799/raw"
SUGGESTIONS_REPO = "itsdestin/opensourceeverything"
GH_CACHE_SECONDS = "0"

[env.dev.ai]
binding = "AI"
[[env.dev.d1_databases]]
binding = "DB"
database_name = "opensourceeverything-dev"
database_id = "local-dev"
migrations_dir = "migrations"
